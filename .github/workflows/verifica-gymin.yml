name: Verifica GymIN (solo lettura)

on:
  workflow_dispatch:

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - name: Installa psql 17
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Prepara le query
        run: |
          cat > verifica.sql <<'SQL'
          \echo '=== RIGHE PER TABELLA (public e test) ==='
          SELECT n.nspname AS schema, c.relname AS tabella,
                 (xpath('/row/c/text()', query_to_xml(format('select count(*) as c from %I.%I', n.nspname, c.relname), false, true, '')))[1]::text::bigint AS righe
          FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname IN ('public','test') AND c.relkind = 'r'
          ORDER BY 1, 2;

          \echo '=== TABELLE: public e test hanno le stesse colonne? ==='
          WITH p AS (SELECT table_name, string_agg(column_name||':'||data_type, ',' ORDER BY column_name) cols
                     FROM information_schema.columns WHERE table_schema='public' GROUP BY 1),
               t AS (SELECT table_name, string_agg(column_name||':'||data_type, ',' ORDER BY column_name) cols
                     FROM information_schema.columns WHERE table_schema='test' GROUP BY 1)
          SELECT COALESCE(p.table_name, t.table_name) AS tabella,
                 CASE WHEN p.cols IS NULL THEN 'solo in test'
                      WHEN t.cols IS NULL THEN 'solo in public'
                      WHEN p.cols = t.cols THEN 'uguale'
                      ELSE 'DIVERSA' END AS confronto
          FROM p FULL JOIN t ON p.table_name = t.table_name
          ORDER BY 2, 1;

          \echo '=== COLLEGAMENTI TRA SCHEMI (chiavi esterne) ==='
          SELECT cn.nspname||'.'||c.relname AS tabella, fn.nspname||'.'||f.relname AS punta_a
          FROM pg_constraint k
          JOIN pg_class c ON c.oid = k.conrelid JOIN pg_namespace cn ON cn.oid = c.relnamespace
          JOIN pg_class f ON f.oid = k.confrelid JOIN pg_namespace fn ON fn.oid = f.relnamespace
          WHERE k.contype = 'f' AND cn.nspname IN ('public','test') AND cn.nspname <> fn.nspname
          ORDER BY 1;

          \echo '=== VISTE FUORI DA test CHE USANO test ==='
          SELECT DISTINCT dn.nspname||'.'||dc.relname AS vista, rn.nspname||'.'||rc.relname AS usa
          FROM pg_depend d JOIN pg_rewrite r ON r.oid = d.objid
          JOIN pg_class dc ON dc.oid = r.ev_class JOIN pg_namespace dn ON dn.oid = dc.relnamespace
          JOIN pg_class rc ON rc.oid = d.refobjid JOIN pg_namespace rn ON rn.oid = rc.relnamespace
          WHERE rn.nspname = 'test' AND dn.nspname <> 'test';

          \echo '=== FUNZIONI IN public CHE NOMINANO test ==='
          SELECT p.proname AS funzione FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
          WHERE n.nspname = 'public' AND p.prosrc ILIKE '%test.%';

          \echo '=== UTENTI (auth) ==='
          SELECT count(*) AS utenti FROM auth.users;

          \echo '=== FILE IN STORAGE ==='
          SELECT bucket_id, count(*) AS file FROM storage.objects GROUP BY 1;
          SQL

      - name: Vecchio GymIN
        env: { DB: "${{ secrets.MIGRA_OLD_DB_URL }}" }
        run: psql -X -v ON_ERROR_STOP=1 -f verifica.sql "$DB"

      - name: GymIN produzione
        env: { DB: "${{ secrets.MIGRA_PROD_DB_URL }}" }
        run: psql -X -v ON_ERROR_STOP=1 -f verifica.sql "$DB"
